spring.application.name=smart-parking-backend

spring.datasource.url=${DB_URL:jdbc:h2:mem:smart_parking;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToAtLeast32CharactersLongForProduction}
app.jwt.expiration=86400000